<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>Pinterest Clone</title>
</head>
<body>

    <aside class="pinterest-sidebar">
        <div class="sidebar-top">
            <div class="logo" id="logo-home">
                <img src="https://pngimg.com/uploads/pinterest/pinterest_PNG45.png" alt="Pinterest Logo">
            </div>
            <button class="icon-btn active" title="Inicio">
                <img src="./img/material-symbols--home.svg" alt="Inicio">
            </button>
            <button class="icon-btn" title="Explorar">
                <img src="./img/explore.svg" alt="Explorar">
            </button>
            <button class="icon-btn" title="Tableros">
                <img src="./img/table.svg" alt="Tableros">
            </button>
            <button class="icon-btn" title="Crear">
                <img src="./img/crear.svg" alt="Crear">
            </button>
            <button class="icon-btn" title="Notificaciones">
                <img src="./img/notificacion.svg" alt="Notificaciones">
            </button>
            <button class="icon-btn" title="Mensajes">
                <img src="./img/mensaje.svg" alt="Mensajes">
            </button>
        </div>
        <div class="sidebar-bottom">
            <button class="icon-btn" title="Configuración">
                <img src="./img/configuracion.svg" alt="Configuración">
            </button>
        </div>
    </aside>

    <div class="app-container">
        
        <header class="top-header">
            <div class="search-bar-container">
                <span class="search-icon">
                    <svg height="16" width="16" viewBox="0 0 24 24" fill="#767676">
                        <path d="M10 16c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6m10.21 4.79l-4.54-4.54A8.014 8.014 0 0018 10c0-4.42-3.58-8-8-8s-8 3.58-8 8 3.58 8 8 8c1.85 0 3.55-.63 4.9-.16l4.54 4.54c.39.39 1.02.39 1.41 0 .38-.39.39-1.03 0-1.42z"></path>
                    </svg>
                </span>
                <input type="text" id="search-input" placeholder="Buscar">
            </div>
        </header>

        <div class="categories-container">
            <button class="pill active" data-category="all">Para ti</button>
        </div>
